backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 7;
shadow-opacity = 0.5;
shadow-exclude = [
  "class_g = 'awesome'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

corner-radius = 0;

wintypes: {
  tooltip = { fade = true; shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1; };
  dropdown_menu = { opacity = 1; };
};
